<app-document-import-presentation
  [editable]="editable()"
  [documents]="documents()"
  [type]="type()"
  [files]="files()"
  [busy]="busy()"
  [progress]="progress()"
  [error]="error()"
  [message]="message()"
  [proposal]="proposal()"
  [selection]="selection()"
  [selectedCount]="selectedCount()"
  [anyAnalyzable]="anyAnalyzable()"
  [labels]="store.labels()"
  [answers]="store.answers()"
  (typeChanged)="type.set($event)"
  (filesPicked)="pickFiles($event)"
  (fileTypeChanged)="setFileType($event.id, $event.type)"
  (fileRemoved)="removeFile($event)"
  (importRequested)="importFiles()"
  (analyzeRequested)="analyze($event)"
  (reviewRequested)="review($event)"
  (selectionToggled)="toggle($event.path, $event.checked)"
  (applyRequested)="apply()"
  (proposalDismissed)="proposal.set(null)"
  (downloadRequested)="download($event)"
/>
