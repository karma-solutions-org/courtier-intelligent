<app-document-import-presentation
  [editable]="editable()"
  [documents]="store.documents()"
  [type]="store.type()"
  [files]="store.files()"
  [busy]="store.busy()"
  [progress]="store.progress()"
  [error]="store.error()"
  [message]="store.message()"
  [proposal]="store.proposal()"
  [selection]="store.selection()"
  [selectedCount]="store.selectedCount()"
  [anyAnalyzable]="store.anyAnalyzable()"
  [labels]="dossierStore.labels()"
  [answers]="dossierStore.answers()"
  (typeChanged)="store.setType($event)"
  (filesPicked)="store.pickFiles($event)"
  (fileTypeChanged)="store.setFileType($event.id, $event.type)"
  (fileRemoved)="store.removeFile($event)"
  (importRequested)="store.importFiles()"
  (analyzeRequested)="store.analyze($event)"
  (reviewRequested)="store.review($event)"
  (selectionToggled)="store.toggle($event.path, $event.checked)"
  (applyRequested)="store.apply()"
  (proposalDismissed)="store.dismissProposal()"
  (downloadRequested)="store.download($event)"
/>
