<app-dossier-detail-presentation
  [dossier]="store.dossier()"
  [assure]="store.assure()"
  [product]="store.product()"
  [error]="store.error()"
  [loaded]="store.loaded()"
  [backUrl]="backUrl()"
  [selected]="selected()"
  [currentStage]="currentStage()"

  [isAdmin]="isAdmin()"
  [confirmingDelete]="confirmingDelete()"

  [closing]="closing()"

  [answers]="store.answers()"
  [missing]="store.missing()"
  [missingLabels]="missingLabels()"
  [isComplete]="store.isComplete()"
  [editable]="store.editable()"
  [saveStatus]="store.saveStatus()"
  [need]="store.need()"
  [guarantees]="store.guarantees()"
  [needSuggestion]="store.needSuggestion()"
  [needEditable]="store.needEditable()"
  [needPending]="store.needPending()"
  [events]="store.events()"
  [memberNames]="store.memberNames()"
  [insurerNames]="store.insurerNames()"
  [eventsHasMore]="store.eventsHasMore()"
  [eventsLoadingMore]="store.eventsLoadingMore()"
  (selectedChanged)="selected.set($event)"
  (assignRequested)="store.assign($event)"
  (closeRequested)="classerSansSuite($event.id, $event.reference)"
  (confirmingDeleteChanged)="confirmingDelete.set($event)"
  (removeRequested)="remove($event)"
  (answerChanged)="onAnswer($event)"
  (saveRequested)="store.saveNow({ event: true })"
  (needSaved)="store.saveNeed($event)"
  (needValidated)="store.validateNeed()"
  (loadMoreEvents)="store.loadMoreEvents()"
/>
