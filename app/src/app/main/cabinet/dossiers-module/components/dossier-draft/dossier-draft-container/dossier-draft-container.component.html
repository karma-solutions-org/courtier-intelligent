<app-dossier-draft-presentation
  [dossier]="store.dossier()"
  [saveStatus]="store.saveStatus()"
  [saveLabel]="saveLabel()"
  [view]="view()"
  [error]="store.error()"
  [loaded]="store.loaded()"
  [readingClientPieces]="store.clientPiecesReading()"
  [availableInsurers]="store.availableInsurers()"
  [checkedInsurers]="checkedInsurers()"
  [sectionIndex]="sectionIndex()"
  [sectionCount]="store.schema().length"
  [currentSection]="currentSection()"
  [isLastSection]="isLastSection()"
  [sectionMissing]="sectionMissing()"
  [answers]="store.answers()"
  [showMissing]="showMissing()"
  [validating]="validating()"
  (viewChanged)="view.set($event)"
  (insurerToggled)="toggleInsurer($event.insurerId, $event.checked)"
  (insurersValidated)="validateInsurers()"
  (saveAndQuitRequested)="saveAndQuit()"
  (answerChanged)="onAnswer($event)"
  (sectionRequested)="goTo($event)"
  (nextRequested)="next()"
/>
