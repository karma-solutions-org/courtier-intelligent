<app-trash-presentation
  [groups]="visibleGroups()"
  [query]="query()"
  [kind]="kind()"
  [period]="period()"
  [hasFilters]="hasFilters()"
  [loadError]="loadError()"
  [searchUnavailable]="searchUnavailable()"
  [busy]="busy()"
  [confirming]="confirming()"
  (queryChanged)="setQuery($event)"
  (kindChanged)="setKind($event)"
  (periodChanged)="setPeriod($event)"
  (filtersCleared)="clearFilters()"
  (confirmingChanged)="confirming.set($event)"
  (restoreRequested)="restore($event)"
  (deleteRequested)="deleteForever($event)"
  (loadMore)="loadMore($event)"
/>
