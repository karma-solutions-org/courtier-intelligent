<app-trash-presentation
  [groups]="store.visibleGroups()"
  [query]="store.query()"
  [kind]="store.kind()"
  [period]="store.period()"
  [hasFilters]="store.hasFilters()"
  [loadError]="store.loadError()"
  [searchUnavailable]="store.searchUnavailable()"
  [busy]="store.busy()"
  [confirming]="store.confirming()"
  (queryChanged)="store.setQuery($event)"
  (kindChanged)="store.setKind($event)"
  (periodChanged)="store.setPeriod($event)"
  (filtersCleared)="store.clearFilters()"
  (confirmingChanged)="store.setConfirming($event)"
  (restoreRequested)="store.restore($event)"
  (deleteRequested)="store.deleteForever($event)"
  (loadMore)="store.loadMore($event)"
/>
