<app-assure-detail-presentation
  [assure]="store.selected()"
  [loaded]="store.loaded()"
  [dossiers]="store.dossiers()"
  [documents]="documents()"
  [isAdmin]="isAdmin()"
  [editing]="editing()"
  [confirmingDelete]="confirmingDelete()"
  [isPending]="store.isPending()"
  [error]="store.error()"
  [duplicates]="duplicates()"
  (editStarted)="startEdit()"
  (editCancelled)="editing.set(false)"
  (confirmingDeleteChanged)="confirmingDelete.set($event)"
  (deleteRequested)="store.remove($event)"
  (updateRequested)="store.update($event)"
  (candidateChanged)="checkDuplicates($event)"
  (documentOpened)="openDocument($event)"
/>
