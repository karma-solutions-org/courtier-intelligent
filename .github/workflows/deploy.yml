name: Deploy (test)

# Déploie l'app Angular sur le projet Firebase de TEST (aibs-partenaire-testing).
# ⚠️ Ce projet est partagé avec aibs-partenaire et compli-scan : on déploie UNIQUEMENT
# le site d'hébergement dédié « courtier-intelligent » (cible définie dans .firebaserc),
# jamais l'hébergement par défaut ni les règles Firestore/Storage.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build
        working-directory: ./app
        run: npm run build

      - name: Prepare Google Application Credentials
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_DEV }}" | base64 --decode > "google-application-credentials.json"

      - name: Install Firebase
        run: npm install -g firebase-tools

      - name: Deploy hosting (site courtier-intelligent)
        run: firebase deploy --only hosting:courtier-intelligent --project aibs-partenaire-testing --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: google-application-credentials.json

      - name: Remove credentials file
        if: always()
        run: |
          rm -f google-application-credentials.json
