name: Set up Playwright
description: Install Playwright's Chromium, restored from cache when this Playwright version already ran.

runs:
  using: composite
  steps:
    - name: Read Playwright version
      id: version
      shell: bash
      run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}

    - name: Install Playwright browsers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium

    # The cache holds the browser only, not the system packages it links against.
    - name: Install Playwright system dependencies
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium
